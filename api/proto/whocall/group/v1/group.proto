    // 群组业务标识
    string group_id = 2;
    // 操作人用户标识
    string operator_user_id = 3;
    // 群组名称
    string group_name = 4;
    // 头像地址
    string avatar_url = 5;
    // 群简介
    string introduction = 6;
    // 群公告内容
    string notification = 7;
    // needverification字段
    bool need_verification = 8;
