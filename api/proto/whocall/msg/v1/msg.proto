syntax = "proto3";

package whocall.msg.v1;

option go_package = "github.com/ethereal3x/who-call/api/gen/go/whocall/msg/v1;msgv1";

import "google/api/annotations.proto";
import "whocall/common/v1/common.proto";

service MsgService {
    rpc SendMsg(SendMsgRequest) returns (SendMsgResponse) {
        option (google.api.http) = { post: "/api/v1/messages/send" body: "*" };
    }

    rpc BatchSendMsg(BatchSendMsgRequest) returns (BatchSendMsgResponse) {
        option (google.api.http) = { post: "/api/v1/messages/batch-send" body: "*" };
    }

    rpc GetNewestSeq(GetNewestSeqRequest) returns (GetNewestSeqResponse) {
        option (google.api.http) = { post: "/api/v1/messages/newest-seq" body: "*" };
    }

    rpc PullMsgBySeqList(PullMsgBySeqListRequest) returns (PullMsgBySeqListResponse) {
        option (google.api.http) = { post: "/api/v1/messages/pull-by-seq-list" body: "*" };
    }

    rpc PullMsgBySeqRange(PullMsgBySeqRangeRequest) returns (PullMsgBySeqRangeResponse) {
        option (google.api.http) = { post: "/api/v1/messages/pull-by-seq-range" body: "*" };
    }

    rpc MarkConversationRead(MarkConversationReadRequest) returns (MarkConversationReadResponse) {
        option (google.api.http) = { post: "/api/v1/messages/mark-read" body: "*" };
    }

    rpc RevokeMsg(RevokeMsgRequest) returns (RevokeMsgResponse) {
        option (google.api.http) = { post: "/api/v1/messages/revoke" body: "*" };
    }

    rpc DeleteMsg(DeleteMsgRequest) returns (DeleteMsgResponse) {
        option (google.api.http) = { post: "/api/v1/messages/delete" body: "*" };
    }

    rpc GetMsg(GetMsgRequest) returns (GetMsgResponse) {
        option (google.api.http) = { get: "/api/v1/messages/{server_msg_id}" };
    }
}

enum ContentType {
    CONTENT_TYPE_UNSPECIFIED = 0;
    CONTENT_TYPE_TEXT = 101;
    CONTENT_TYPE_IMAGE = 102;
    CONTENT_TYPE_VOICE = 103;
    CONTENT_TYPE_VIDEO = 104;
    CONTENT_TYPE_FILE = 105;
    CONTENT_TYPE_LOCATION = 106;
    CONTENT_TYPE_CARD = 107;
    CONTENT_TYPE_MERGER = 108;
    CONTENT_TYPE_AT_TEXT = 109;
    CONTENT_TYPE_CUSTOM = 110;
    CONTENT_TYPE_TYPING = 200;
    CONTENT_TYPE_REVOKE = 201;
    CONTENT_TYPE_READ_RECEIPT = 202;
    CONTENT_TYPE_FRIEND_APPLICATION_NOTIFICATION = 301;
    CONTENT_TYPE_GROUP_APPLICATION_NOTIFICATION = 302;
    CONTENT_TYPE_GROUP_MEMBER_CHANGED_NOTIFICATION = 303;
    CONTENT_TYPE_CONVERSATION_CHANGED_NOTIFICATION = 304;
    CONTENT_TYPE_SYSTEM_NOTIFICATION = 900;
}

enum MessageStatus {
    MESSAGE_STATUS_UNSPECIFIED = 0;
    MESSAGE_STATUS_SENDING = 1;
    MESSAGE_STATUS_SENT = 2;
    MESSAGE_STATUS_PERSISTED = 3;
    MESSAGE_STATUS_DELIVERED = 4;
    MESSAGE_STATUS_READ = 5;
    MESSAGE_STATUS_REVOKED = 6;
    MESSAGE_STATUS_DELETED = 7;
    MESSAGE_STATUS_FAILED = 8;
}

enum PullOrder {
    PULL_ORDER_UNSPECIFIED = 0;
    PULL_ORDER_ASC = 1;
    PULL_ORDER_DESC = 2;
}

enum DeleteScope {
    DELETE_SCOPE_UNSPECIFIED = 0;
    DELETE_SCOPE_LOCAL = 1;
    DELETE_SCOPE_ALL = 2;
}

message MsgOptions {
    bool is_persistent = 1;
    bool is_offline_push = 2;
    bool is_history = 3;
    bool is_sender_sync = 4;
    bool is_unread_count = 5;
    bool is_conversation_update = 6;
    bool is_notification = 7;
    bool is_read_receipt = 8;
}

message MsgData {
    string client_msg_id = 1;
    string server_msg_id = 2;
    string send_id = 3;
    string recv_id = 4;
    string group_id = 5;
    string conversation_id = 6;
    int64 conversation_seq = 7;
    whocall.common.v1.ConversationType conversation_type = 8;
    whocall.common.v1.Platform sender_platform = 9;
    string sender_nickname = 10;
    string sender_avatar_url = 11;
    ContentType content_type = 12;
    bytes content = 13;
    MessageStatus status = 14;
    bool is_read = 15;
    MsgOptions options = 16;
    whocall.common.v1.OfflinePushInfo offline_push_info = 17;
    repeated string at_user_ids = 18;
    int64 send_time_ms = 19;
    int64 create_time_ms = 20;
    string operation_id = 21;
    string attached_info = 22;
    string ex = 23;
    string quote_server_msg_id = 24;
}

message TextContent {
    string text = 1;
}

message ImageContent {
    string file_id = 1;
    string url = 2;
    int32 width = 3;
    int32 height = 4;
    int64 size = 5;
    string mime_type = 6;
    string thumbnail_url = 7;
}

message VoiceContent {
    string file_id = 1;
    string url = 2;
    int32 duration_seconds = 3;
    int64 size = 4;
    string mime_type = 5;
}

message VideoContent {
    string file_id = 1;
    string url = 2;
    string snapshot_url = 3;
    int32 width = 4;
    int32 height = 5;
    int32 duration_seconds = 6;
    int64 size = 7;
    string mime_type = 8;
}

message FileContent {
    string file_id = 1;
    string file_name = 2;
    string url = 3;
    int64 size = 4;
    string mime_type = 5;
    string checksum = 6;
}

message LocationContent {
    double longitude = 1;
    double latitude = 2;
    string description = 3;
}

message CardContent {
    string user_id = 1;
    string nickname = 2;
    string avatar_url = 3;
}

message AtTextContent {
    string text = 1;
    repeated string at_user_ids = 2;
    bool at_all = 3;
}

message CustomContent {
    string type = 1;
    string data = 2;
    string description = 3;
    string extension = 4;
}

message RevokeContent {
    string revoker_user_id = 1;
    string server_msg_id = 2;
    string client_msg_id = 3;
    int64 revoke_time_ms = 4;
    string reason = 5;
}

message ReadReceiptContent {
    string conversation_id = 1;
    string reader_user_id = 2;
    int64 read_seq = 3;
    repeated string server_msg_ids = 4;
    int64 read_time_ms = 5;
}

message SendMsgRequest {
    whocall.common.v1.RequestMeta meta = 1;
    MsgData msg_data = 2;
}

message SendMsgResponse {
    whocall.common.v1.ResponseHeader header = 1;
    string server_msg_id = 2;
    string client_msg_id = 3;
    int64 send_time_ms = 4;
    int64 conversation_seq = 5;
    MsgData msg_data = 6;
}

message BatchSendMsgRequest {
    whocall.common.v1.RequestMeta meta = 1;
    repeated MsgData messages = 2;
}

message SendMsgResult {
    string client_msg_id = 1;
    string server_msg_id = 2;
    int64 conversation_seq = 3;
    int32 code = 4;
    string message = 5;
}

message BatchSendMsgResponse {
    whocall.common.v1.ResponseHeader header = 1;
    repeated SendMsgResult results = 2;
}

message GetNewestSeqRequest {
    whocall.common.v1.RequestMeta meta = 1;
    string user_id = 2;
    repeated string conversation_ids = 3;
}

message ConversationSeq {
    string conversation_id = 1;
    int64 min_seq = 2;
    int64 max_seq = 3;
    int64 read_seq = 4;
}

message GetNewestSeqResponse {
    whocall.common.v1.ResponseHeader header = 1;
    repeated ConversationSeq seqs = 2;
}

message PullMsgBySeqListRequest {
    whocall.common.v1.RequestMeta meta = 1;
    string user_id = 2;
    string conversation_id = 3;
    repeated int64 seqs = 4;
}

message PullMsgBySeqListResponse {
    whocall.common.v1.ResponseHeader header = 1;
    repeated MsgData messages = 2;
    repeated int64 missing_seqs = 3;
}

message PullMsgBySeqRangeRequest {
    whocall.common.v1.RequestMeta meta = 1;
    string user_id = 2;
    string conversation_id = 3;
    int64 begin_seq = 4;
    int64 end_seq = 5;
    int32 limit = 6;
    PullOrder order = 7;
}

message PullMsgBySeqRangeResponse {
    whocall.common.v1.ResponseHeader header = 1;
    repeated MsgData messages = 2;
    int64 next_begin_seq = 3;
    bool has_more = 4;
    repeated int64 missing_seqs = 5;
}

message MarkConversationReadRequest {
    whocall.common.v1.RequestMeta meta = 1;
    string user_id = 2;
    string conversation_id = 3;
    int64 read_seq = 4;
}

message MarkConversationReadResponse {
    whocall.common.v1.ResponseHeader header = 1;
    string conversation_id = 2;
    int64 read_seq = 3;
    int64 unread_count = 4;
}

message RevokeMsgRequest {
    whocall.common.v1.RequestMeta meta = 1;
    string operator_user_id = 2;
    string conversation_id = 3;
    string server_msg_id = 4;
    string reason = 5;
}

message RevokeMsgResponse {
    whocall.common.v1.ResponseHeader header = 1;
    MsgData revoke_msg = 2;
}

message DeleteMsgRequest {
    whocall.common.v1.RequestMeta meta = 1;
    string operator_user_id = 2;
    string conversation_id = 3;
    repeated string server_msg_ids = 4;
    DeleteScope delete_scope = 5;
}

message DeleteMsgResponse {
    whocall.common.v1.ResponseHeader header = 1;
    repeated string deleted_server_msg_ids = 2;
}

message GetMsgRequest {
    whocall.common.v1.RequestMeta meta = 1;
    string user_id = 2;
    string conversation_id = 3;
    string server_msg_id = 4;
}

message GetMsgResponse {
    whocall.common.v1.ResponseHeader header = 1;
    MsgData msg_data = 2;
}